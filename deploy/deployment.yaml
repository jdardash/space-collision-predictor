apiVersion: apps/v1
kind: Deployment
metadata:
  name: sda
  labels:
    app.kubernetes.io/name: sda
    app.kubernetes.io/component: api
spec:
  # The TLE catalog and the alert log live in process memory, so replicas do not
  # share state. Two replicas are fine for availability; per-replica rate limit
  # buckets and alert dedupe are independent, which is documented in README.md.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sda
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sda
          image: ghcr.io/jdardash/space-collision-predictor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: sda-config
            - secretRef:
                name: sda-secrets
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              # A full-catalog all-pairs screen is CPU bound and numpy heavy.
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            # Startup seeds the catalog from CelesTrak with a demo-TLE fallback,
            # so allow up to two minutes before the liveness probe takes over.
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
