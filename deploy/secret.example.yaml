# Example only. Do not commit real credentials: create the Secret out of band with
#   kubectl create secret generic sda-secrets \
#     --from-literal=SDA_SPACETRACK_USER=... \
#     --from-literal=SDA_SPACETRACK_PASS=... \
#     --from-literal=SDA_WEBHOOK_URLS=https://hooks.slack.com/services/...
# or from a sealed-secret / external-secret controller.
apiVersion: v1
kind: Secret
metadata:
  name: sda-secrets
  labels:
    app.kubernetes.io/name: sda
type: Opaque
stringData:
  SDA_SPACETRACK_USER: "replace-me"
  SDA_SPACETRACK_PASS: "replace-me"
  # Comma separated. Prefix with slack=, discord= or generic= to force a payload
  # format; otherwise the format is detected from the host.
  SDA_WEBHOOK_URLS: ""
