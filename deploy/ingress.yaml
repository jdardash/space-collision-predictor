# Example ingress. Adjust the host, the ingressClassName and the TLS issuer for
# your cluster. The WebSocket endpoint /ws/positions needs a controller that
# proxies upgrades (ingress-nginx does by default).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sda
  labels:
    app.kubernetes.io/name: sda
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sda.example.com
      secretName: sda-tls
  rules:
    - host: sda.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sda
                port:
                  name: http
