[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "space-collision-predictor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sgp4>=2.22",
    "numpy>=1.26",
    "plotly>=5.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/sda"]

[project.scripts]
sda-server = "sda.api:run"
