[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "space-collision-predictor"
version = "0.2.0"
description = "Satellite conjunction analysis engine with SGP4 propagation and collision probability"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "jdardash", email = "jsdardashti@gmail.com"}]
keywords = [
    "satellite",
    "conjunction",
    "sgp4",
    "orbital-mechanics",
    "space-domain-awareness",
    "collision-probability",
    "tle",
    "astrodynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "sgp4>=2.22,<3.0",
    "numpy>=1.26,<3.0",
    "plotly>=5.18,<6.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-cov>=4.0,<6.0", "httpx>=0.27"]
lint = ["mypy>=1.8", "ruff>=0.3"]
dev = ["space-collision-predictor[test,lint]"]

[project.urls]
Homepage = "https://github.com/jdardash/space-collision-predictor"
Documentation = "https://github.com/jdardash/space-collision-predictor#readme"
Repository = "https://github.com/jdardash/space-collision-predictor"
Issues = "https://github.com/jdardash/space-collision-predictor/issues"
Changelog = "https://github.com/jdardash/space-collision-predictor/blob/master/CHANGELOG.md"

[project.scripts]
sda-server = "sda.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/sda"]

# --- Tool configuration ---

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.mypy]
# numpy's bundled stubs use PEP 695 `type` statements, which mypy rejects outright
# under a pre-3.12 target. Runtime support is still 3.11+ (see requires-python and
# the CI test matrix); ruff's py311 target guards against 3.12-only syntax.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sda"]
